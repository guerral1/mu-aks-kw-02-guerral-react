apiVersion: v1
kind: Service
metadata:
  name: guerral-mu-aks-react
  namespace: guerral
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: 'true'
spec:
  type: LoadBalancer
  selector:
    app: guerral-mu-aks-react
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
